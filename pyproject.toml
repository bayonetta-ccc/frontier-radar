[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-radar"
version = "0.1.0"
description = "个人前沿情报雷达：把新信息转化为有证据、有边界、可回滚的判断更新"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Frontier Radar contributors" }]
keywords = ["intelligence", "research", "evidence", "tracking", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
frontier-radar = "frontier_radar.cli:main"

[project.urls]
Homepage = "https://github.com/bayonetta-ccc/frontier-radar"
Repository = "https://github.com/bayonetta-ccc/frontier-radar"
Issues = "https://github.com/bayonetta-ccc/frontier-radar/issues"

[tool.setuptools]
packages = ["frontier_radar"]

[tool.setuptools.package-data]
frontier_radar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
