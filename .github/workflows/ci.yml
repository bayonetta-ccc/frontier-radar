name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Demo smoke test
        run: |
          python -m frontier_radar --quiet demo
          python -m frontier_radar validate

      - name: Metrics quality gates
        run: python -m frontier_radar metrics --json

      - name: Static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.os }}-py${{ matrix.python-version }}
          path: data/web
          if-no-files-found: error
